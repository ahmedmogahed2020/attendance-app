name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install web deps and sync Android
        run: |
          npm ci
          npm run sync

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk attendance.apk
          TAG="v1.${GITHUB_RUN_NUMBER}"
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "$TAG" attendance.apk --title "الحضور والانصراف $TAG" --notes "$NOTES" --latest
