<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحضور والانصراف</title>
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.json">
<script>
  // شكل التطبيق قبل ما الصفحة تترسم عشان مفيش وميض
  (function(){var st='vivid';try{var x=JSON.parse(localStorage.getItem('attendance_state_v1')||'null');if(x&&x.settings&&x.settings.style)st=x.settings.style;}catch(e){}
  if(st!=='default')document.documentElement.setAttribute('data-style',st);})();
</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600 700;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400 500;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600 700;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Reem Kufi";font-weight:500;font-display:swap;src:url(fonts/reem-kufi-arabic-500-normal.woff2) format("woff2")}
@font-face{font-family:"Reem Kufi";font-weight:700;font-display:swap;src:url(fonts/reem-kufi-arabic-700-normal.woff2) format("woff2")}

:root{
  --bg:#EEF1F4;--paper:#FFFFFF;--ink:#1B2730;--muted:#5E6E7A;--line:#D6DDE3;--soft:#E4E9EE;
  --teal:#0F766E;--teal-soft:#DDEFEC;--rose:#B4483F;--rose-soft:#F6E3E0;
  --amber-ink:#7A5A00;--amber-soft:#FBF0CF;--violet:#5D5AA8;--violet-soft:#E6E5F5;--green:#2F7D4F;--green-soft:#E1F1E6;
  --scrim:rgba(20,30,38,.55);--shadow:0 1px 2px rgba(20,30,38,.06),0 4px 14px rgba(20,30,38,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:16px;--bar:#0F766E;
  --bar-ink:#fff;--bar-soft:rgba(255,255,255,.14);--bar-on-bg:#fff;--bar-on-ink:#0F766E;--ring-track:rgba(255,255,255,.22);--ring-fill:#F4C53A;--on-accent:#fff;--fab-bg:var(--teal);--fab-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C;--paper:#192128;--ink:#E5EBEF;--muted:#93A3AF;--line:#2B3740;--soft:#232E36;
  --teal:#5FC0B7;--teal-soft:#1C3533;--rose:#E58A80;--rose-soft:#3A2321;
  --amber-ink:#EBCB6A;--amber-soft:#3A3115;--violet:#A4A1EE;--violet-soft:#2A2945;--green:#7FD39E;--green-soft:#1B3325;
  --scrim:rgba(0,0,0,.65);--shadow:none;--bar:#123B38;--bar-on-bg:var(--paper);--bar-on-ink:var(--teal);--on-accent:#0b1715;--fab-ink:#0b1715;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C;--paper:#192128;--ink:#E5EBEF;--muted:#93A3AF;--line:#2B3740;--soft:#232E36;
  --teal:#5FC0B7;--teal-soft:#1C3533;--rose:#E58A80;--rose-soft:#3A2321;
  --amber-ink:#EBCB6A;--amber-soft:#3A3115;--violet:#A4A1EE;--violet-soft:#2A2945;--green:#7FD39E;--green-soft:#1B3325;
  --scrim:rgba(0,0,0,.65);--shadow:none;--bar:#123B38;--bar-on-bg:var(--paper);--bar-on-ink:var(--teal);--on-accent:#0b1715;--fab-ink:#0b1715;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* الهيدر */
.top{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.top h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:0;word-spacing:.25em}
.top .sub{font-size:13px;opacity:.85;margin-top:1px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:8px 12px;min-height:40px;background:var(--bar-soft);color:var(--bar-ink);font-weight:600;font-size:14px;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding:12px 14px}
.tab{display:none}.tab.on{display:block}

/* عناصر عامة */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:13.5px}
.sec-title{font-size:13px;color:var(--muted);font-weight:600;margin:16px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:14.5px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--teal);color:var(--on-accent)}


.btn.ghost{background:transparent;color:var(--teal);padding:6px 8px;min-height:36px}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:500}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--bg);min-height:44px}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent}
input[type=time]{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-present,.c-offwork{background:var(--green-soft);color:var(--green)}
.c-absent{background:var(--rose-soft);color:var(--rose)}
.c-excused,.c-leave{background:var(--violet-soft);color:var(--violet)}
.c-off{background:var(--soft);color:var(--muted)}
.c-pending,.c-missing{background:var(--amber-soft);color:var(--amber-ink)}
.c-future{background:var(--soft);color:var(--muted)}

/* شريط التاريخ / الشهر */
.nav-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav-bar .arrow{flex:0 0 44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.nav-bar .arrow svg{width:20px;height:20px}
.picker{flex:1;position:relative;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0}
.picker b{font-size:16px;font-weight:600;line-height:1.2}
.picker small{font-size:11.5px;color:var(--muted);line-height:1.2}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;min-height:0;padding:0;border:0}

/* شريط ملخص */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip b{font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--amber-soft);color:var(--amber-ink);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:500}
.banner .btn{background:var(--paper);color:var(--amber-ink);flex:0 0 auto}
.banner.ok{background:var(--green-soft);color:var(--green)}

/* كارت الموظف في اليوم */
.emp{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:90px}
.emp.flash{outline:2px solid var(--teal)}
.emp.need{border-color:color-mix(in srgb,var(--amber-ink) 45%,var(--line))}
.emp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.emp-name{font-weight:600;font-size:15.5px;line-height:1.3}
.emp-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 2px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.s-present{color:var(--green)}.seg button.on.s-absent{color:var(--rose)}.seg button.on.s-excused,.seg button.on.s-leave{color:var(--violet)}
.seg.two{grid-template-columns:1fr 1fr}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.times .dev{font-size:11.5px;color:var(--muted);margin-top:3px;text-align:center}
.times input.edited{border-color:var(--teal);background:var(--teal-soft)}
.row-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.row-tools select{width:auto;min-height:34px;padding:4px 8px;font-size:13px;border-radius:10px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stat{flex:1 1 0;min-width:64px;background:var(--bg);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.bad b{color:var(--rose)}.stat.good b{color:var(--green)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;min-height:32px}
.tg.on{border-style:solid;border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.warn-line{margin-top:8px;font-size:13px;color:var(--amber-ink);background:var(--amber-soft);border-radius:10px;padding:6px 10px}

/* الشهر */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.total{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.total b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.total span{font-size:11.5px;color:var(--muted)}
.ctrls{display:flex;gap:8px;margin-bottom:12px}
.ctrls .seg{margin:0;flex:0 0 150px;grid-template-columns:1fr 1fr}
.ctrls select{flex:1}
.mrow{display:block;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mrow-top .hrs{font-size:20px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.mrow-top .hrs small{font-size:12px;color:var(--muted);font-weight:500}
.mrow .chips{margin-top:8px}
.mrow .chip{padding:3px 9px;font-size:12.5px;background:var(--bg)}
.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--muted);font-weight:600;font-size:12.5px;background:var(--bg)}
tbody tr{cursor:pointer}
tbody tr:active td{background:var(--teal-soft)}
tr.tot td{font-weight:700;background:var(--teal-soft);cursor:default}
td.bad{color:var(--rose)}td.good{color:var(--green)}
.emp-title{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 8px;font-weight:600}

.ctrls .seg.three{flex:0 0 190px;grid-template-columns:repeat(3,1fr)}
/* الرسوم */
:root{--c1:#1E8C6E;--c2:#6A5FC1;--c3:#C2485F;--c4:#A68510}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#279677;--c2:#7D70D6;--c3:#D14F6A;--c4:#AD8D10}}
:root[data-theme="dark"]{--c1:#279677;--c2:#7D70D6;--c3:#D14F6A;--c4:#AD8D10}
.chart h2{margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.cols{width:100%;height:auto;display:block;overflow:visible}
svg.cols .grid{stroke:var(--line);stroke-width:1}
svg.cols .ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:0}
svg.cols .tick{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
svg.cols .ref-t{fill:var(--ink);font-weight:600}
svg.cols .hl{fill:var(--soft)}
.cap{font-size:13px;color:var(--ink);background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:8px;min-height:34px}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,34%) 1fr auto;align-items:center;gap:8px;font-size:13px}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:14px;display:flex;justify-content:flex-start}
.hb-b{height:14px;border-radius:0 4px 4px 0}
[dir=rtl] .hb-b{border-radius:4px 0 0 4px}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;min-width:42px;text-align:left}
.stackbar{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stackbar span{display:block;min-width:4px}
/* الموظفين */
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer}
.li:first-child{border-top:0}
.avatar{flex:0 0 40px;height:40px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.li .chev{color:var(--muted);width:18px;height:18px}
.li.gone{opacity:.55}

/* الإعدادات */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-weight:600;font-size:14.5px}
.set-row .lbl span{font-size:12.5px;color:var(--muted)}
.set-row input,.set-row select{width:150px;flex:0 0 auto}
.set-row input[type=number]{width:90px;text-align:center}
.shift{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px 8px;align-items:end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.shift>div:first-child{grid-column:1/-1}
.shift input{min-width:0}
.shift input[type=time]{padding:9px 4px;font-size:15px}
.shift .btn{padding:5px 8px}
.file-list{font-size:13px;color:var(--muted);margin:6px 0 0;padding:0;list-style:none}
.file-list li{padding:4px 0;border-top:1px dashed var(--line)}
.file-list li:first-child{border-top:0}

/* البوتوم ناف */
nav.bottom{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;padding:8px 0 6px;min-height:60px;cursor:pointer;position:relative}
nav.bottom svg{width:23px;height:23px}
nav.bottom button.on{color:var(--teal);font-weight:600}
nav.bottom .badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);background:var(--rose);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}

/* شيت / ديالوج */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;margin:auto auto 0;max-height:90vh}
dialog::backdrop{background:var(--scrim)}
dialog .in{padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
dialog h2{margin:0 0 12px;font-size:18px;font-family:var(--f-display);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (max-width:380px){.seg button{font-size:12.5px}.totals{grid-template-columns:repeat(2,1fr)}}
.set-row input,.set-row select{max-width:46%}
html,body{overflow-x:hidden}

/* شاشة التحميل */
#splash{position:fixed;inset:0;z-index:100;background:#0F766E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-fp{width:150px;height:150px;overflow:visible}
.sp-lines path{fill:none;stroke:#fff;stroke-width:4.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .55s cubic-bezier(.4,0,.2,1) var(--d) forwards}
.sp-scan{fill:#7FE0D2;opacity:0;animation:sp-scan .75s ease-in-out .25s forwards}
.sp-clock{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-pop .35s cubic-bezier(.3,1.5,.6,1) .85s forwards}
.sp-name{font-family:var(--f-display);font-weight:700;font-size:26px;color:#fff;word-spacing:.25em;opacity:0;transform:translateY(6px);animation:sp-in .4s ease .9s forwards}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-scan{0%{opacity:0;transform:translateY(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(64px)}}
@keyframes sp-pop{to{transform:scale(1)}}
@keyframes sp-in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sp-lines path,.sp-clock,.sp-name{animation:none;stroke-dashoffset:0;transform:none;opacity:1}.sp-scan{display:none}}

/* زرار التسجيل السريع */
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--fab-bg);color:var(--fab-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb,var(--fab-bg) 40%,transparent);cursor:pointer}
.fab svg{width:28px;height:28px}


main{padding-bottom:80px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer;min-height:38px;position:relative;color:var(--ink)}
.qchip.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.qdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0;cursor:pointer}
.qtypes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qtypes .qchip{border-radius:12px;min-height:44px}
.qtypes .qchip.on.q-absent{background:var(--rose);border-color:var(--rose)}
.qtypes .qchip.on.q-excused,.qtypes .qchip.on.q-leave,.qtypes .qchip.on.q-late,.qtypes .qchip.on.q-early{background:var(--violet);border-color:var(--violet)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font:inherit;color:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--teal);border-color:transparent}
.notes{margin-top:6px}
.note-line{display:flex;align-items:flex-start;gap:6px;font-size:13.5px;background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:6px 10px;margin-top:6px;line-height:1.5}
.note-line::before{content:"📝";flex:0 0 auto}
.note-x{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px;min-height:0}
.note-td{max-width:220px;white-space:normal;font-size:12.5px;color:var(--muted)}
.rv-list{display:grid;gap:8px;max-height:52vh;overflow:auto}
.rv{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px}
.rv b{font-weight:600}
.rv-btns{display:flex;gap:6px;flex:0 0 auto}
.ctrls{flex-wrap:wrap}
.ctrls .seg.four{flex:1 1 100%;grid-template-columns:repeat(4,1fr);margin:0}

/* ===== التصميم الجديد ===== */
.top-row{gap:6px}.top-row .grow{min-width:0}
.top .icon-btn{width:38px;height:38px;padding:0;justify-content:center;flex:0 0 38px}
.top .sub:empty{display:none}
#top-extra:empty{display:none}
.hero{display:flex;gap:14px;align-items:center;max-width:720px;margin:10px auto 0}
.ring{position:relative;width:80px;height:80px;flex:0 0 80px}.ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}.ring b small{font-size:10.5px;font-weight:400;opacity:.85}
.hero-t{position:relative;font-size:13px;line-height:1.65;opacity:.95;cursor:pointer;margin:0;color:var(--bar-ink)}.hero-t b{display:block;font-size:15.5px}
.hero-t input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0;cursor:pointer}
.week{display:flex;gap:4px;max-width:720px;margin:12px auto 0;align-items:stretch}
.wd{flex:1;border:0;border-radius:12px;padding:5px 0 6px;background:var(--bar-soft);color:var(--bar-ink);font-size:11px;position:relative;cursor:pointer;min-width:0}
.wd b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.wd.on{background:var(--bar-on-bg);color:var(--bar-on-ink)}


.wd.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--bar-ink)}
.wd i{position:absolute;top:5px;left:6px;width:6px;height:6px;border-radius:50%;background:#F4C53A}
.wk-arrow{flex:0 0 24px;border:0;background:transparent;color:var(--bar-ink);opacity:.8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.wk-arrow svg{width:18px;height:18px}
.inbox{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.inbox b{font-size:14px}.inbox .muted{font-size:12.5px}.inbox .grow{flex:1;min-width:0}
.inbox-n{flex:0 0 38px;height:38px;border-radius:11px;background:var(--amber-soft);color:var(--amber-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.vt{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.vt button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.vt button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fil{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fc{flex:1 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.fc b{font-variant-numeric:tabular-nums}
.fc.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:13.5px;font-weight:500}
.bulk span{flex:1 1 auto}
.avatar{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.avatar.warn{background:var(--amber-soft);color:var(--amber-ink)}
.avatar.big{flex-basis:58px;width:58px;height:58px;font-size:22px}
.li2{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;text-align:right}
.li2:first-child{border-top:0}
.li2:active{background:var(--teal-soft)}
.li2.need{background:color-mix(in srgb,var(--amber-soft) 45%,var(--paper))}
.li2 .grow{flex:1;min-width:0}
.li2 .t,.li .t{font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:baseline}
.li2 .t small,.ed-head .t small{color:var(--muted);font-weight:400;font-size:12px}
.li2 .s,.li .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.li2 .pill{margin-top:2px}
.li.on{background:var(--teal-soft)}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.flag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.flag.r{background:var(--rose-soft);color:var(--rose)}.flag.g{background:var(--green-soft);color:var(--green)}.flag.v{background:var(--violet-soft);color:var(--violet)}.flag.a{background:var(--amber-soft);color:var(--amber-ink)}.flag.n{background:var(--soft);color:var(--ink)}
.qa{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.qa .btn{background:var(--paper);border:1px solid var(--line);min-height:32px}
/* الخط الزمني */
.tl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 8px;box-shadow:var(--shadow)}
.tl-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);cursor:pointer}
.tl-row.need .tl-name b{color:var(--amber-ink)}
.tl-head{border-top:0;cursor:default;padding:2px 0}
.tl-name{min-width:0}.tl-name b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-name small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-track{position:relative;height:22px}
.tl-head .tl-track{height:14px}
.tl-head .tl-track span{position:absolute;transform:translateX(50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-track i{position:absolute;display:block}
.tl-win{top:2px;height:18px;border:1.5px dashed var(--line);border-radius:6px}
.tl-win.warn{border-color:var(--c4);background:color-mix(in srgb,var(--amber-soft) 50%,transparent)}
.tl-win.bad{border-color:var(--c3)}
.tl-on{top:6px;height:10px;background:var(--c1);border-radius:4px}
.tl-on.fade-l{background:linear-gradient(270deg,var(--c1),transparent)}
.tl-on.fade-r{background:linear-gradient(90deg,var(--c1),transparent)}
.tl-late{top:9px;height:4px;background:var(--c3);border-radius:2px}
.tl-perm{top:9px;height:4px;background:var(--c2);border-radius:2px}
.tl-ot{top:6px;height:10px;background:#7FD3B5;border-radius:4px}
.tl-lbl{position:absolute;inset:2px 0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;border-radius:6px}
.tl-legend{margin:8px 0 0}
.legend i.lg-win{border:1.5px dashed var(--muted);background:none}.legend i.lg-on{background:var(--c1)}.legend i.lg-late{background:var(--c3)}.legend i.lg-perm{background:var(--c2)}.legend i.lg-ot{background:#7FD3B5}
/* شاشة التعديل */
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.ed-head{display:flex;gap:10px;align-items:center}
.ed-head .grow{flex:1;min-width:0}.ed-head .t{font-weight:600;font-size:16px}.ed-head .s{font-size:12.5px;color:var(--muted)}
dialog.full{max-height:100vh;height:100%;border-radius:0;max-width:560px;margin:0 auto}
dialog.full .in{min-height:100%;display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top))}
/* شبكة الشهر */
.gwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.gtable{display:grid;gap:3px;padding:6px;width:max-content;align-items:center}
.g-name{position:sticky;right:0;z-index:2;background:var(--paper);border:0;text-align:right;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 0 6px;height:26px;cursor:pointer;box-shadow:-6px 0 6px -6px rgba(0,0,0,.15)}
.g-h{text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1;padding:2px 0}
.g-h small{display:block;font-size:9.5px}
.g-h.today{color:var(--teal);font-weight:700}
.gc{width:26px;height:26px;border-radius:5px;border:0;padding:0;font-size:10px;font-weight:700;color:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.gc.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.g-out{background:transparent}
.g-zero{background:var(--soft)}
.g-fut{background:transparent;border:1px dashed var(--line)}
.gs-present,.gs-offwork{background:var(--c1)}.gs-excused,.gs-leave{background:var(--c2)}.gs-absent{background:var(--c3)}.gs-pending,.gs-missing{background:var(--c4)}
.gs-off{background:repeating-linear-gradient(45deg,var(--soft) 0 3px,transparent 3px 6px);border:1px solid var(--soft)}
.legend i.gs-off{border:1px solid var(--line)}
.sel-card{margin-top:12px}
/* تقفيل الشهر */
.cf-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.cf-top b{flex:1;font-family:var(--f-display);font-size:18px}.cf-top span{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.cf-prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-bottom:16px}.cf-prog i{display:block;height:100%;background:var(--teal);transition:width .25s}
.cf-card{background:var(--bg);border-radius:22px;padding:20px 16px;text-align:center}
.cf-card .avatar{margin:0 auto 8px}
.cf-name{font-size:19px;font-weight:700}
.cf-msg{font-size:16px;margin:14px 0 2px}
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cf-btn{border:0;border-radius:14px;padding:14px 6px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.cf-btn.teal{background:var(--teal);color:var(--on-accent)}.cf-btn.rose{background:var(--rose-soft);color:var(--rose)}.cf-btn.violet{background:var(--violet-soft);color:var(--violet)}
.cf-nav{display:flex;justify-content:space-between;margin-top:10px}
.cf-done{text-align:center;margin:auto 0;padding:30px 0}.cf-done b{display:block;font-size:20px;margin:10px 0 4px}
.cf-check{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto}
/* البحث */
.search-ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-bottom:30px}
.search-top{position:sticky;top:0;background:var(--bar);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:2}
.srch{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:2px 4px 2px 11px;max-width:720px;margin:0 auto}
.srch svg{width:19px;height:19px;color:var(--muted)}
.srch input{border:0;background:transparent;min-height:42px;padding:0;font-size:16px}
.srch input:focus{outline:none}
.sfs{display:flex;gap:6px;margin:8px auto 0;max-width:720px;overflow-x:auto}
.sf{border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;background:var(--bar-soft);color:var(--bar-ink);white-space:nowrap;cursor:pointer}
.sf.on{background:var(--bar-on-bg);color:var(--bar-on-ink)}
.sres{max-width:720px;margin:0 auto;padding:4px 14px}
mark{background:#FDE68A;color:#1B2730;border-radius:3px;padding:0 1px}
/* ملف الموظف */
.prof{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.prof .grow{flex:1;min-width:0}.prof-n{font-size:18px;font-weight:700}
.mini{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.acts .btn{background:var(--paper);border:1px solid var(--line);color:var(--teal);padding:8px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.cal-h{text-align:center;font-size:10.5px;color:var(--muted);padding-bottom:2px}
.cal-d{border:0;border-radius:9px;min-height:44px;padding:4px 0;font:inherit;font-weight:700;font-size:13px;color:#fff;cursor:pointer;line-height:1.2;font-variant-numeric:tabular-nums}
.cal-d small{display:block;font-size:9.5px;font-weight:500;opacity:.92}
.cal-d.gs-off,.cal-d.g-fut,.cal-d.g-out{color:var(--muted)}
.cal-d.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.cal-d.today{box-shadow:inset 0 0 0 2px #fff}
/* التقارير */
.fb{display:flex;gap:8px;margin-bottom:10px}
.dd{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:right}
.dd small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.dd>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.attn>b{font-size:14px}
.attn-r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13.5px}
.attn-r .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);margin:4px 0 12px}
.tabs>button:not(.xl){flex:1;border:0;background:transparent;padding:8px 0;font:inherit;font-size:14px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs>button.on{color:var(--teal);font-weight:700;border-bottom-color:var(--teal)}
.xl{border:0;background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:0 10px;margin:4px 0 6px;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.xl svg{width:16px;height:16px}
.st-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) .8fr .55fr .8fr;gap:6px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 12px;font:inherit;font-size:13px;text-align:right;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.st-row:first-child{border-top:0}
.st-h{font-size:11.5px;color:var(--muted);background:var(--bg);cursor:default}
.st-n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-n small{font-size:11px;color:var(--muted)}
.st-h2 i{display:block;height:7px;border-radius:4px 0 0 4px;background:var(--c1);margin-bottom:3px;min-width:3px}
.st-row .bad{color:var(--rose);font-weight:600}.st-row .good{color:var(--green);font-weight:600}.st-row .mut{color:var(--muted)}
input[type=search]{-webkit-appearance:none;appearance:none}

/* لسه في الشغل */
.c-working{background:var(--green-soft);color:var(--green);border:1px dashed currentColor}
.c-notyet{background:var(--soft);color:var(--muted)}
.c-latenow{background:var(--amber-soft);color:var(--amber-ink);border:1px dashed currentColor}
.gs-working{background:color-mix(in srgb,var(--c1) 55%,var(--paper));}
.tl-now{top:2px;height:18px;background:var(--c1);border-radius:2px;width:3px!important;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tl-now{animation:none}}
/* رفع الملف */
.up-opt{display:block;width:100%;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--ink)}
.up-opt.rec{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.up-h{display:flex;justify-content:space-between;align-items:center}.up-h b{font-size:15.5px}
.up-tag{font-size:11px;background:var(--teal);color:var(--on-accent);border-radius:999px;padding:1px 9px;font-weight:600}
.up-opt p{margin:2px 0 8px;font-size:12.5px;color:var(--muted);line-height:1.55}
.up-note{background:var(--bg);border-radius:12px;padding:9px 11px;font-size:13px;color:var(--muted)}
table.xls{width:100%;border-collapse:collapse;font:11px/1.4 Arial,sans-serif;background:#fff;color:#222;border:1px solid #C9D3D9;border-radius:6px;overflow:hidden}
table.xls th{background:#E9F2EE;font-weight:700;text-align:left;padding:3px 5px;color:#222;font-size:11px}
table.xls td{padding:3px 5px;border-top:1px solid #E3E8EB;white-space:nowrap;text-align:left}
.mini.ok{background:var(--teal-soft);color:var(--teal);font-weight:600}
.pv{font-size:12.5px}
.pv-r{display:grid;grid-template-columns:48px minmax(0,1fr) 70px 86px;gap:6px;align-items:center;padding:7px 10px;border-top:1px solid var(--soft)}
.pv-r:first-child{border-top:0}
.pv-h{background:var(--bg);color:var(--muted);font-size:11px}
.pv-r small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.pv-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-r.dim{opacity:.55}
.pv-r .in{color:var(--green);font-weight:700}.pv-r .out{color:var(--rose);font-weight:700}
.pv-ne{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.pv-ne:first-child{border-top:0}
.pv-ne input{width:20px;height:20px;min-height:0;flex:0 0 20px;accent-color:var(--teal)}
dialog.full .warn-line{margin-top:8px}

/* ===== أشكال التطبيق ===== */
/* ٢ — داكن احترافي (داكن دايمًا) */
:root[data-style="dark"]{--bg:#0B1220;--paper:#131C2E;--ink:#E6EDF6;--muted:#8A9BB4;--line:#1F2A40;--soft:#1A2438;
  --teal:#34D399;--teal-soft:rgba(52,211,153,.13);--rose:#F87171;--rose-soft:rgba(248,113,113,.14);--amber-ink:#FBBF24;--amber-soft:rgba(251,191,36,.14);
  --violet:#A5A1F5;--violet-soft:rgba(165,161,245,.15);--green:#34D399;--green-soft:rgba(52,211,153,.13);--scrim:rgba(0,0,0,.7);--shadow:none;
  --c1:#279677;--c2:#7D70D6;--c3:#D14F6A;--c4:#AD8D10;
  --bar:#0B1220;--bar-ink:#E6EDF6;--bar-soft:#131C2E;--bar-on-bg:#34D399;--bar-on-ink:#0B1220;--ring-track:#1F2A40;--ring-fill:#34D399;
  --on-accent:#0B1220;--fab-bg:#34D399;--fab-ink:#0B1220;color-scheme:dark}
:root[data-style="dark"] .top{border-bottom:1px solid var(--line)}
:root[data-style="dark"] .li2,:root[data-style="dark"] .tl-row{border-inline-start:3px solid transparent}
:root[data-style="dark"] .li2.need{border-inline-start-color:var(--amber-ink);background:color-mix(in srgb,var(--amber-soft) 60%,var(--paper))}
:root[data-style="dark"] .total b{font-size:20px}
/* ٣ — أبيض بسيط */
:root[data-style="minimal"]{--bg:#FFFFFF;--paper:#FFFFFF;--ink:#111111;--muted:#7A7A7A;--line:#E9E9E9;--soft:#F3F3F3;
  --teal:#111111;--teal-soft:#F2F2F2;--rose:#DC2626;--rose-soft:#FDECEC;--amber-ink:#9A6B00;--amber-soft:#FFF5D6;--violet:#6D5BD0;--violet-soft:#EFECFB;--green:#15803D;--green-soft:#E8F6EE;
  --shadow:none;--r:14px;--c1:#16A34A;--c2:#6D5BD0;--c3:#DC2626;--c4:#E5B000;
  --bar:#FFFFFF;--bar-ink:#111111;--bar-soft:#F3F3F3;--bar-on-bg:#111111;--bar-on-ink:#FFFFFF;--ring-track:#EEEEEE;--ring-fill:#16A34A;
  --on-accent:#FFFFFF;--fab-bg:#111111;--fab-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root[data-style="minimal"]:not([data-theme="light"]){--bg:#0A0A0A;--paper:#0A0A0A;--ink:#F2F2F2;--muted:#8C8C8C;--line:#222;--soft:#1A1A1A;
  --teal:#F2F2F2;--teal-soft:#1C1C1C;--rose:#F87171;--rose-soft:#2A1414;--amber-ink:#FACC15;--amber-soft:#2A2208;--violet:#A5A1F5;--violet-soft:#1E1C33;--green:#4ADE80;--green-soft:#0F2417;
  --c1:#22A35A;--c2:#7D70D6;--c3:#D14F6A;--c4:#AD8D10;--bar:#0A0A0A;--bar-ink:#F2F2F2;--bar-soft:#1A1A1A;--bar-on-bg:#F2F2F2;--bar-on-ink:#0A0A0A;--ring-track:#222;--ring-fill:#4ADE80;--on-accent:#0A0A0A;--fab-bg:#F2F2F2;--fab-ink:#0A0A0A;color-scheme:dark}}
:root[data-style="minimal"] .top{border-bottom:1px solid var(--line)}
:root[data-style="minimal"] .top h1{font-family:var(--f-body);font-weight:700;font-size:19px;word-spacing:0}
:root[data-style="minimal"] .hero-t b{font-size:22px;font-weight:800;letter-spacing:-.3px}
:root[data-style="minimal"] .card,:root[data-style="minimal"] .list,:root[data-style="minimal"] .inbox,:root[data-style="minimal"] .tl,:root[data-style="minimal"] .attn,:root[data-style="minimal"] .gwrap,:root[data-style="minimal"] .cal,:root[data-style="minimal"] .prof{box-shadow:none}
:root[data-style="minimal"] .inbox{border:1.5px solid var(--ink)}
:root[data-style="minimal"] .avatar{background:var(--soft);color:var(--ink)}
:root[data-style="minimal"] .fab{border-radius:50%}
/* ٤ — ملوّن حيوي */
:root[data-style="vivid"]{--bg:#F6F3FF;--paper:#FFFFFF;--ink:#1E1B3A;--muted:#6B6790;--line:#E6E1FA;--soft:#EFEBFF;
  --teal:#5B4BDB;--teal-soft:#ECE9FB;--rose:#D9365E;--rose-soft:#FFE4EA;--amber-ink:#7A5600;--amber-soft:#FFF1C7;--violet:#8B3FD9;--violet-soft:#F3E8FF;--green:#127A4A;--green-soft:#DDF7EA;
  --shadow:0 4px 16px rgba(91,75,219,.08);--r:22px;--c1:#1E8C6E;--c2:#6A5FC1;--c3:#C2485F;--c4:#A68510;
  --bar:#5B4BDB;--bar-ink:#FFFFFF;--bar-soft:rgba(255,255,255,.16);--bar-on-bg:#FFD66B;--bar-on-ink:#1E1B3A;--ring-track:rgba(255,255,255,.22);--ring-fill:#FFD66B;
  --on-accent:#FFFFFF;--fab-bg:#1E1B3A;--fab-ink:#FFD66B}
@media (prefers-color-scheme:dark){:root[data-style="vivid"]:not([data-theme="light"]){--bg:#14122B;--paper:#1E1B3A;--ink:#EEEBFF;--muted:#A19DC7;--line:#2E2A55;--soft:#262248;
  --teal:#9D91FF;--teal-soft:#2A2552;--rose:#FF7A99;--rose-soft:#3A1726;--amber-ink:#FFD66B;--amber-soft:#3A3014;--violet:#D2A8FF;--violet-soft:#2F1F4A;--green:#5EE0A5;--green-soft:#123326;
  --c1:#279677;--c2:#7D70D6;--c3:#D14F6A;--c4:#AD8D10;--bar:#2B2470;--on-accent:#14122B;--fab-bg:#FFD66B;--fab-ink:#14122B;color-scheme:dark}}
:root[data-style="vivid"] .top{border-radius:0 0 26px 26px}
:root[data-style="vivid"] .avatar{border-radius:13px}
:root[data-style="vivid"] .fab{border-radius:20px}
:root[data-style="vivid"] .total{border:0;box-shadow:var(--shadow)}
:root[data-style="vivid"] .totals .total:nth-child(1){background:var(--teal);color:#fff}:root[data-style="vivid"] .totals .total:nth-child(1) span,:root[data-style="vivid"] .totals .total:nth-child(1) b{color:#fff!important}
:root[data-style="vivid"] .totals .total:nth-child(2){background:#FF8FA3}:root[data-style="vivid"] .totals .total:nth-child(2) *{color:#3A0A14!important}
:root[data-style="vivid"] .totals .total:nth-child(3){background:#FFD66B}:root[data-style="vivid"] .totals .total:nth-child(3) *{color:#3A2A00!important}
:root[data-style="vivid"] .totals .total:nth-child(4){background:#7FE0C0}:root[data-style="vivid"] .totals .total:nth-child(4) *{color:#08392A!important}
:root[data-style="vivid"] nav.bottom{border-radius:24px 24px 0 0;border-top:0;box-shadow:0 -4px 20px rgba(91,75,219,.1)}

/* اختيار شكل التطبيق */
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sty{border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:6px;cursor:pointer;font:inherit;color:var(--ink);text-align:center}
.sty.on{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.sty-prev{border-radius:11px;overflow:hidden;height:74px;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.06)}
.sty-prev .hb{height:24px}.sty-prev .bdy{flex:1;padding:6px;display:flex;gap:4px;align-items:flex-start}
.sty-prev .bdy i{flex:1;height:26px;border-radius:6px}
.sty b{display:block;font-size:13.5px;margin-top:6px}

/* الشيفتات والأيام الخاصة */
.shift-box{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--bg)}
.shift-box.off{opacity:.6}
.shift-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.shift-top input{flex:1;font-weight:600}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.chk label,.sw{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);margin:0;cursor:pointer;white-space:nowrap}
.chk input,.sw input{width:20px;height:20px;min-height:0;accent-color:var(--teal)}

/* تراجع / قفل / إجازات / ملاحظات ذكية */
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:14px;justify-content:space-between;min-width:280px}
.undo-btn{border:0;background:transparent;color:#FFD66B;font:inherit;font-weight:700;cursor:pointer;padding:4px 2px}
.banner.lockb{background:var(--soft);color:var(--ink)}
.c-holiday{background:color-mix(in srgb,#F59E0B 18%,var(--paper));color:#9A5B00}
.gs-holiday{background:repeating-linear-gradient(45deg,#F5B94A 0 3px,#FCE3B0 3px 6px)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.meter{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0 2px}.meter i{display:block;height:100%;background:var(--teal);border-radius:4px}
.ins-wrap{margin-bottom:12px}
.ins{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin-bottom:7px}
.ins b{display:block;font-size:14px}.ins span{font-size:12.5px;color:var(--muted)}.ins .grow{flex:1;min-width:0}
.ins-e{font-size:20px;line-height:1.2}
.i-r{background:var(--rose-soft)}.i-a{background:var(--amber-soft)}.i-g{background:var(--green-soft)}.i-v{background:var(--violet-soft)}
.ins-strip{display:flex;gap:2px;margin-top:6px}.ins-strip i{flex:1;height:12px;border-radius:2px;background:color-mix(in srgb,var(--paper) 60%,transparent)}.ins-strip i.on{background:var(--c3)}

/* قفل التطبيق */
.lock-ov{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,var(--bar),color-mix(in srgb,var(--bar) 70%,#000));color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(70px + env(safe-area-inset-top)) 20px 30px;transition:opacity .25s}
.lock-ov.out{opacity:0}
.lk-ico{width:76px;height:76px;border-radius:20px;background:#0F766E;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.lk-t{font-family:var(--f-display);font-weight:700;font-size:21px;margin-top:14px;word-spacing:.25em}
.lk-msg{opacity:.85;font-size:14px;margin-top:2px;min-height:22px;text-align:center}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:24px 0 28px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:block}
.pin-dots i.f{background:currentColor}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px 26px;justify-content:center}
.pin-pad button,.pin-pad span{width:68px;height:68px;border-radius:50%;border:0;font:inherit;font-size:25px;font-weight:600;color:inherit;display:flex;align-items:center;justify-content:center}
.pin-pad button{background:rgba(255,255,255,.13);cursor:pointer}
.pin-pad button:active{background:rgba(255,255,255,.3)}
.pin-pad .bio{font-size:28px}
.lk-hint{margin-top:16px;font-size:13px;opacity:.85}
.lk-forgot{margin-top:auto;border:0;background:transparent;color:#fff;opacity:.75;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.pin-sheet{color:var(--ink);text-align:center;padding-bottom:10px}
.pin-sheet .pin-pad button{background:var(--soft)}
.toast{bottom:calc(146px + env(safe-area-inset-bottom))}

/* جهاز البصمة + شبكة الشهور */
.sync-chip{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--line);background:var(--paper);color:var(--muted);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:500;cursor:pointer;min-height:40px;text-align:start}
.sync-chip .sc-i{font-size:16px;color:var(--teal);line-height:1}
.sync-chip.run .sc-i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-bar .arrow:disabled,.yr-bar .arrow:disabled{opacity:.35;cursor:default}
.banner.nagb{align-items:center}
.banner.nagb .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.banner.nagb small{font-weight:400;opacity:.9}
.banner .note-x{color:inherit}
.dev-res{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px}
.dev-res.ok{background:var(--green-soft);color:var(--green)}
.dev-res.bad{background:var(--rose-soft);color:var(--rose)}
.dev-res small{display:block;margin-top:4px;opacity:.85}
.dev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:8px;color:var(--ink)}
.dev-grid small{display:block;color:var(--muted);font-size:11.5px;margin:0}
.dev-grid span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.dev-res .warn-line{margin-top:8px}
.dev-note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:6px 10px;margin:-4px 0 10px}
.yr-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.yr-bar b{font-size:20px}
.yr-bar .arrow{flex:0 0 44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.yr-bar .arrow svg{width:20px;height:20px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:64px}
.mt b{font-size:15px}
.mt small{font-size:11.5px;color:var(--muted);min-height:14px}
.mt.lk{background:var(--violet-soft)}
.mt.lk small{color:var(--violet)}
.mt.pn small{color:var(--amber-ink)}
.mt.off{opacity:.38;cursor:default;background:transparent;border-style:dashed}
.mt.on{outline:2px solid var(--teal);outline-offset:1px}
.mt-act{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.mt-act .grow{min-width:0}
.mt-act .btn:not(.primary){background:var(--paper)}
.st-opt{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.st-opt .so-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.st-opt .so-t{font-weight:700;font-size:15px}.st-opt .so-s{font-size:12.5px;color:var(--muted)}
/* صفحة الموظفين — كروت */
.mk-chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}
.mk-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:36px}
.mk-chip b{font-size:12px;background:var(--soft);border-radius:999px;padding:0 7px}
.mk-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.mk-chip.on b{background:rgba(127,127,127,.25)}
.mk-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ec-bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:2px 2px 8px}
.ec-sort{width:auto;min-height:34px;padding:4px 10px;font-size:13px;font-weight:600;border-radius:10px;background:var(--paper)}
.ec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ec{background:var(--paper);border-radius:18px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;text-align:right;color:var(--ink);cursor:pointer;min-width:0}
.ec.gone{opacity:.7}
.ec-top{display:flex;align-items:center;gap:9px;min-width:0}
.ec-av{position:relative;flex:0 0 42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff}
.ec-av i{position:absolute;bottom:-3px;inset-inline-start:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--paper)}
.ec-nm{min-width:0;flex:1}.ec-nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:right}.ec-nm small{color:var(--muted);font-size:11.5px}
.ec-st{font-size:12.5px;font-weight:600;border-radius:10px;padding:5px 8px;line-height:1.5}
.st-in{background:var(--green-soft);color:var(--green)}.st-wait{background:var(--soft);color:var(--muted)}.st-late{background:var(--amber-soft);color:var(--amber-ink)}.st-off{background:var(--violet-soft);color:var(--violet)}.st-done{background:var(--teal-soft);color:var(--teal)}.st-bad{background:var(--rose-soft);color:var(--rose)}
.ec-bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.ec-bar i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.ec-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.ec-tags{display:flex;gap:4px;flex-wrap:wrap}.ec-tags span{font-size:11px;border-radius:7px;padding:1px 6px;background:var(--soft);color:var(--muted);font-weight:600}
.ec-tags .r{background:var(--rose-soft);color:var(--rose)}.ec-tags .a{background:var(--amber-soft);color:var(--amber-ink)}.ec-tags .g{background:var(--green-soft);color:var(--green)}
.ec-gone-t{display:block;width:100%;background:none;border:0;color:var(--muted);font-weight:600;font-size:13px;margin:14px 0 8px;cursor:pointer}
/* الإعدادات: صفحة رئيسية + أقسام */
.set-home{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.set-sec{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:right;cursor:pointer}
.set-sec:first-child{border-top:0}
.set-sec .ic{flex:0 0 44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px}
.set-sec .grow{min-width:0}.set-sec b{font-size:15px;display:block}.set-sec small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block;margin-top:2px}
.set-sec .chv{color:var(--muted);display:inline-flex}.set-sec .chv svg{width:18px;height:18px}
.set-back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--teal);font-weight:700;font-size:14px;padding:4px 0;margin-bottom:4px;cursor:pointer}
.set-back svg{width:18px;height:18px}
.set-title{font-size:19px;margin:2px 2px 12px}
details.adv{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}
details.adv>summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 0;list-style:none}
details.adv>summary::before{content:'⚙ ';}
details.adv>summary::-webkit-details-marker{display:none}
/* المرتبات */
.pay-steps{display:flex;gap:6px;margin:4px 0 12px}.pay-steps span{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.pay-steps .on{color:var(--ink);border-color:var(--teal)}.pay-steps .dn{color:var(--teal);border-color:var(--teal)}
.pay-nums{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);color:var(--ink);cursor:pointer}
.pay-nums .grow{min-width:0}.pay-nums b{display:block;font-size:14.5px}.pay-nums small{color:var(--muted);font-size:12.5px}
.pay-sum{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--teal),#8B7CF6);box-shadow:var(--shadow);margin-bottom:12px}
:root:not([data-style="vivid"]) .pay-sum{background:linear-gradient(135deg,var(--teal),#3E5C8C)}
.pay-sum small{opacity:.88;font-size:12.5px}.pay-sum .big{font-size:30px;font-weight:800;margin:2px 0 10px;letter-spacing:-.5px}.pay-sum .big span{font-size:15px;font-weight:600;opacity:.85}
.pay-sum .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pay-sum .row div{background:rgba(255,255,255,.16);border-radius:12px;padding:7px 8px;font-size:11.5px}.pay-sum .row b{display:block;font-size:15px}
.pay-row{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);color:var(--ink);cursor:pointer}
.pay-row .grow{min-width:0}.pay-row .grow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pay-row small{color:var(--muted);font-size:12px}.pay-row small.wr{color:var(--amber-ink)}
.pay-row .net{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:3px}.pay-row .net b{font-size:17px}
.pb{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}.pb.draft{background:var(--amber-soft);color:var(--amber-ink)}.pb.approved{background:var(--green-soft);color:var(--green)}.pb.paid{background:var(--violet-soft);color:var(--violet)}
.pay-in{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.pay-in>b{display:block;margin-bottom:6px}
.pay-in input{font-size:17px;font-weight:700}
.mk-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.qt-wrap{overflow-x:auto}.qt{width:100%;border-collapse:collapse;font-size:13px}.qt th{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center}.qt td{padding:4px 2px;border-top:1px solid var(--line);text-align:center}
.qt td:first-child{text-align:right;font-weight:600;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}.qt td input{min-height:36px;padding:4px;text-align:center;font-size:14px;width:56px;font-weight:600}
.slip-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-size:13px}.slip-nav .btn{max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.slip-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.slip-hd .grow{min-width:0}.slip-hd b{display:block}.slip-hd small{color:var(--muted);font-size:12px}
.slip .warn-line{margin:8px 14px 0}
.sl-g{padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--soft);margin-top:8px}
.sl{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}.sl-g+.sl{border-top:0}
.sl .grow{min-width:0}.sl small{display:block;color:var(--muted);font-size:11.5px;line-height:1.5}.sl .amt{font-weight:800;white-space:nowrap}.sl .amt.m{color:var(--rose)}.sl .amt.p{color:var(--green)}
.sl .amt s{color:var(--muted);font-weight:500;font-size:12px;margin-inline-end:4px}
.sl.chg{background:color-mix(in srgb,var(--amber-soft) 55%,var(--paper))}
.sl .ed{flex:0 0 32px;height:32px;border-radius:9px;background:var(--soft);border:0;color:var(--muted);cursor:pointer}
.sl-ed{padding:10px 14px;border-top:1px solid var(--line);background:var(--soft)}
.slip-net{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--teal-soft);font-weight:700;margin-top:8px}.slip-net b{font-size:20px;color:var(--teal)}
.seg2{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}.seg2 button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-weight:600;color:var(--muted);cursor:pointer}.seg2 .on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.ptabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:0 0 12px}.ptabs button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}.ptabs .on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.mv-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.mv-hd h2{margin:0}
.mv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.mv-grid div{background:var(--soft);border-radius:12px;padding:8px 10px}.mv-grid small{display:block;color:var(--muted);font-size:11.5px}.mv-grid b{font-size:16px}
.mv-hist{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.8}
.debt{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.debt-t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.debt-t b{font-size:16px;display:block}.debt-t small{display:block;color:var(--muted);font-size:12px}
.debt-big{font-size:24px;font-weight:800;color:var(--rose)}
.debt-prog{height:9px;border-radius:99px;background:var(--rose-soft);overflow:hidden;margin:10px 0 6px}.debt-prog i{display:block;height:100%;background:var(--teal);border-radius:99px}
.debt-this{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:10px}.debt-this .grow{min-width:0}.debt-this small{display:block;color:var(--muted);font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs>button{flex:0 0 auto;white-space:nowrap}
/* شاشات بعنوان وزراير ثابتين */
html.lock,html.lock body{overflow:hidden}
dialog{overscroll-behavior:contain}
dialog.pnl{overflow:hidden}
dialog.pnl .in{padding:0;height:100%;min-height:0;display:flex;flex-direction:column}
.pn-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--paper);flex:0 0 auto}
.pn-hd b{font-size:17px;font-weight:700;padding-inline-start:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-x{flex:0 0 40px;height:40px;border-radius:12px;background:var(--soft);border:0;font-size:22px;color:var(--muted);cursor:pointer}
.pn-x[data-armed]{flex:0 0 auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--rose);background:var(--rose-soft)}
.pn-body{flex:1;overflow:auto;padding:12px 16px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pn-ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);flex:0 0 auto}
.acc{display:block;width:100%;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--paper);overflow:hidden;text-align:right;color:var(--ink)}
.acc>summary,.acc-btn{display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc .grow{min-width:0}.acc small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}.acc small.ok{color:var(--green)}.acc small.bad{color:var(--rose)}
.acc .chv{color:var(--muted);display:inline-flex;transition:transform .2s}.acc .chv svg{width:18px;height:18px}.acc[open] .chv{transform:rotate(-90deg)}
.acc-b{padding:0 14px 14px}
.acc-btn{border:1px solid var(--line);background:var(--paper)}
.big-in{font-size:20px!important;font-weight:700;text-align:right;min-height:52px}
.pchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.pchips button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer;min-height:38px}
.pchips .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.pchips em{font-style:normal;font-size:11px;background:var(--soft);color:var(--muted);border-radius:99px;padding:0 6px}.pchips .on em{background:rgba(127,127,127,.3);color:inherit}
.prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:text}.prod:first-child{border-top:0}
.prod .grow{min-width:0}.prod b{display:block;font-size:15px}.prod small{color:var(--muted);font-size:12.5px}
.qty-in{flex:0 0 96px;width:96px;font-size:22px!important;font-weight:700;text-align:center;min-height:52px}
.ptot{display:flex;justify-content:space-between;align-items:center;background:var(--teal-soft);border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}.ptot b{color:var(--teal);font-size:19px}
.pay-sum .row button{border:0;text-align:right;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 9px;font-size:11.5px;color:#fff;position:relative;cursor:pointer;font-family:inherit}
.pay-sum .row button b{display:block;font-size:15px}.pay-sum .row button i{position:absolute;left:8px;top:7px;font-style:normal;opacity:.75}
.brk{background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.brk .t{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}.brk .t span:last-child{color:var(--rose)}
.brk .bar{height:6px;border-radius:9px;background:var(--rose-soft);margin:6px 0 4px;overflow:hidden}.brk .bar i{display:block;height:100%;background:var(--rose)}
.brk-e{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--paper);border-radius:10px;padding:8px 10px;margin-top:6px;text-align:right;color:var(--ink);cursor:pointer;font-size:13px}
.brk-e .grow{min-width:0}.brk-e b{display:block;font-size:13px}.brk-e small{display:block;color:var(--muted);font-size:11.5px;line-height:1.5}.brk-e>span:last-child{font-weight:700;color:var(--rose);white-space:nowrap}
.rs-mode{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.rs-mode button{flex:1;border:0;background:transparent;padding:11px 0;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.rs-mode .on{background:var(--teal);color:var(--on-accent,#fff)}
.btn.wa{background:#25D366;color:#fff}.btn.wa:active{background:#1DA851}
.wa-next{text-align:center;padding:6px 0 14px}.wa-next b{display:block;font-size:17px;margin-top:8px}.wa-ok{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto}
</style>
</head>
